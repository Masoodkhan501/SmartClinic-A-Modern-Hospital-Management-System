<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Setting Doc</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body>
    <div class="min-h-screen bg-sky-100 p-10 flex justify-center">
        <div class="bg-white shadow-xl shadow-gray-400 md:w-2/3 w-11/12">
            <header class="flex flex-col items-center p-5 md:py-10">
                <div>
                    <p class="text-2xl md:text-6xl md:font-extrabold text-sky-800 font-bold md:pb-3">
                        CareWell Hospital
                    </p>
                    <p class="text-lg font-semibold text-end text-gray-400 md:text-4xl md:font-bold">
                        Set Doc
                    </p>
                </div>
            </header>
            <section class="flex">
                <div class="w-full md:w-2/3 p-5 md:px-10">
                    <form th:action="@{/admin/set/doctor}" method="post" th:object="${appt}">
                        <div class="w-full flex space-x-5 md:space-x-12">
                            <!-- appointment id -->
                            <input type="text" th:field="*{app_id}" readonly
                                class="border-2 border-gray-400 rounded-lg w-1/4 md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />

                            <!-- patient name -->
                            <input type="text" th:field="*{p_id.user_id.name}" readonly
                                class="border-2 border-gray-400 rounded-lg w-2/4 md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />
                        </div>

                        <!-- Symptoms -->
                        <textarea rows="5" th:field="*{notes}"
                            class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg"></textarea>

                        <!-- set Date-->
                        <input type="date" th:field="*{dateofAppointment}"
                            class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />

                        <!-- set doc-->
                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-2 pl-2">Assign Doctor</label>
                            <select th:field="*{d_id}" required class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg">
                                <option value="">-- Select Doctor --</option>
                                <option th:each="doc : ${Alldoc}" th:value="${doc.doc_id}"
                                    th:text="${doc.user_id.name + ' (' + #strings.listJoin(doc.specializations.![specialization], ', ') + ')'}"></option>
                            </select>

                        </div>

                        <!-- Submit button -->
                        <div class="flex justify-center">
                            <input type="submit" value="Save"
                                class="bg-sky-700 hover:bg-sky-900 text-white font-bold py-2 px-4 rounded-lg w-2/3 mt-5">
                        </div>
                    </form>
                </div>
                <div class="hidden w-1/3 md:flex pt-20">
                    <img th:src="@{/images/Doctor-pana.png}" alt="Doctor Illustration" class="h-2/3" />
                </div>
            </section>
        </div>
    </div>

</body>

</html>
