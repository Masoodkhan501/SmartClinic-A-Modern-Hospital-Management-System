<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book an Appointment</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body>
    <div class="min-h-screen bg-sky-50 flex justify-center md:py-16">
        <div class="page bg-white flex-col md:w-2/3 w-11/12 mx-auto shadow-xl rounded-sm">
            <div class="head flex justify-center gap-x-5 pt-10">
                <div class="heading flex-col">
                    <p class="md:text-6xl text-2xl font-extrabold text-sky-800">CareWell Hospital</p>
                    <p th:text="${appointmentdto.appt.app_id} != null ? 'Edit Appointment' : 'Book an Appointment'"
                        class="text-end md:text-4xl font-semibold text-gray-400 md:pt-3"></p>
                </div>
            </div>
            <main class=" flex justify-center px-12 md:px-14 pb-10">
                <div class="flex w-full">
                    <div class="formdetails w-full md:w-2/3 md:px-5 py-5 md:py-10">
                        <form
                            th:action="@{${appointmentdto.appt.app_id} != null ? '/update/appointment' : '/accept/appointment'}"
                            th:object="${appointmentdto}" method="post">
                            <input type="hidden" th:field="*{appt.app_id}" />
                            <input type="text" th:value="*{user.name}"
                                class="border-2 border-gray-400 rounded-sm px-3 py-1 md:text-lg md:py-2 w-full mb-3 md:mb-5">
                            <input type="number"
                                class="border-2 border-gray-400 rounded-sm px-3 py-1 md:text-lg md:py-2 w-full mb-3 md:mb-5"
                                placeholder="eg, +91 phone number">
                            <textarea rows="5" th:field="*{appt.notes}"
                                class="border-2 border-gray-400 rounded-sm px-3 py-1 md:text-lg md:py-2 w-full mb-3 md:mb-5"
                                placeholder="Enter Your symptoms or details"></textarea>
                            <div class="flex justify-center ">
                                <input type="submit" value="Submit"
                                    class="w-2/3 bg-sky-700 hover:bg-sky-800 transform delay-75 duration-100 hover:scale-105 text-white rounded-sm py-2">
                            </div>
                            <input type="hidden" th:name="by" th:value="*{user.role}">
                        </form>
                    </div>
                    <div class="md:w-1/3 hidden md:flex items-center">
                        <img th:src="@{/images/Doctors-bro.png}" alt="group of doctors">
                    </div>
                </div>

            </main>
        </div>
    </div>
</body>

</html>
