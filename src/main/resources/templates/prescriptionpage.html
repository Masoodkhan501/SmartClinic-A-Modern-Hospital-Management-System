<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Setting Fee</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body>
    <div class="min-h-screen bg-sky-100 p-10 flex justify-center">
        <div class="bg-white shadow-xl shadow-gray-400 w-2/3">
            <header class="flex flex-col items-center p-5 md:py-10">
                <div>
                    <p class="text-2xl md:text-6xl md:font-extrabold text-sky-800 font-bold md:pb-3">
                        CareWell Hospital
                    </p>
                    <p class="text-lg font-semibold text-end text-gray-400 md:text-4xl md:font-bold">
                        prescription
                    </p>
                </div>
            </header>
            <section class="flex">
                <div class="w-full md:w-2/3 p-5 md:px-10">
                    <form th:action="@{/doctor/save/prescription/{appt_id}(appt_id=${appt.app_id})}" method="post">
                        <div class="w-full flex space-x-5 md:space-x-12">
                            <!-- appointment id -->
                            <input type="text" th:value="${appt.app_id}" readonly
                                class="border-2 border-gray-400 rounded-lg w-1/3 md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />

                            <!-- patient name -->
                            <input type="text" th:value="${appt.p_id.user_id.name}" readonly
                                class="border-2 border-gray-400 rounded-lg w-2/3 md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />
                        </div>

                        <!-- Symptoms -->
                        <textarea rows="5" th:text="${appt.notes}" readonly
                            class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg"></textarea>

                        <!-- diagnosis-->

                        <input type="text" th:field="${pres.diagnosis}" placeholder="Enter the reason"
                            class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />
                        <div>
                            <label class="block text-lg font-medium text-gray-700 mb-2 pl-2">Operation Needed?</label>
                            <select th:field="${appt.operationRequired}" required
                                class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg">
                                <option value="">-- Operation Needed? --</option>
                                <option th:each="req : ${Operationrequirement}" th:value="${req}" th:text="${req}">
                                </option>
                            </select>

                        </div>

                        <!-- set doc-->

                        <input type="text" placeholder="Enter the medicines" th:field="${pres.medicines}"
                            class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg" />
                        <textarea type="text" rows="3" th:field="${pres.advice}"
                            placeholder="Entet the directions for medicines"
                            class="border-2 border-gray-400 rounded-lg w-full md:py-2 py-1 md:px-4 px-2 mb-2 md:mb-4 md:text-lg"></textarea>

                        <!-- Submit button -->
                        <div class="flex justify-center">
                            <input type="submit" value="Save"
                                class="bg-sky-700 hover:bg-sky-900 text-white font-bold py-2 px-4 rounded-lg w-2/3 mt-5">
                        </div>
                    </form>
                </div>
                <div class="hidden w-1/3 md:flex pt-20">
                    <img th:src="@{/images/Doctors-bro.png}" alt="Doctor Illustration" class="h-2/3" />
                </div>
            </section>
        </div>
    </div>

</body>

</html>
