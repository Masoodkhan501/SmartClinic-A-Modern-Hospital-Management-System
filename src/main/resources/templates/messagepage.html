<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" th:href="@{/css/output.css}">
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-8 space-y-6 border border-gray-200">

        <h2 class="text-2xl font-bold text-gray-800">Send a Message</h2>

        <form th:action="@{/message/send}" method="post" th:object="${message}" class="space-y-5">

            <!-- Hidden Sender ID -->
            <!-- <input type="hidden" th:field="*{sender}" /> -->
            <input type="hidden" th:field="*{sender.id}" />
            <input type="hidden" th:field="*{receiver.id}" />
            <input type="hidden" th:name="by" th:value="${by}">
            <div class="flex gap-x-10">
                <div class="w-1/2 flex">
                    <label class="md:flex hidden items-center text-gray-700 font-medium mb-1 mr-3">Sender</label>
                    <input type="text" th:field="*{sender.name}"
                        class="w-full px-4 py-2 rounded-xl border border-gray-300  shadow-sm focus:outline-none">
                </div>

                <div class="flex w-1/2 ">
                    <label class="md:flex hidden items-center text-gray-700 font-medium mb-1 mr-3">Reciever</label>
                    <input type="text" th:field="*{receiver.name}"
                        class="w-full px-4 py-2 rounded-xl border border-gray-300  shadow-sm focus:outline-none">
                </div>

            </div>

            <div>
                <label class="block text-gray-700 font-medium mb-1">Subject</label>
                <input type="text" th:field="*{subject}" placeholder="Enter message subject"
                    class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm"
                    required>
            </div>

            <!-- Content -->
            <div>
                <label class="block text-gray-700 font-medium mb-1">Content</label>
                <textarea th:field="*{content}" placeholder="Type your message here..." rows="5"
                    class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm resize-none"
                    required></textarea>
            </div>


            <!-- Submit Button -->
            <div class="flex justify-center">
                <input type="submit" value="Send Message"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-xl shadow transition-all duration-200">
            </div>
        </form>

    </div>
</body>

</html>
