<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../static/css/output.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-8 space-y-6 border border-gray-200">

    <h2 class="text-2xl font-bold text-gray-800">Send a Message</h2>

    <form th:action="@{/messages/save}" method="post" th:object="${message}" class="space-y-5">

        <!-- Hidden Sender ID -->
        <input type="hidden" th:field="*{sender}" />

        <!-- Hidden Receiver ID -->
        <!-- <input type="hidden" th:name="by" th:value="${by}" /> -->

        <!-- To (Doctor/Admin) -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Send To</label>
            <select class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm">
                <option value="" disabled selected>Select receiver type</option>
                <option th:if="${by=='patient' or by=='admin'}" name="receiver" value="doctor">Doctor</option>
                <option th:if="${by=='patient or by=='doctor'}" name="receiver" value="admin">Admin</option>
                <option th:if="${by=='admin' or by=='doctor'}" name="receiver" value="admin">Patient</option>
            </select>
        </div>

        <!-- Receiver Name -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Receiver Name</label>
            <input type="text" th:name="to"
                   class="w-full px-4 py-2 rounded-xl border border-gray-300  shadow-sm focus:outline-none">
        </div>

        <!-- Subject -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Subject</label>
            <input type="text" th:field="*{subject}" placeholder="Enter message subject"
                   class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm" required>
        </div>

        <!-- Content -->
        <div>
            <label class="block text-gray-700 font-medium mb-1">Content</label>
            <textarea th:field="*{content}" placeholder="Type your message here..."
                      rows="5"
                      class="w-full px-4 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm resize-none" required></textarea>
        </div>


        <!-- Submit Button -->
        <div class="flex justify-center">
            <input type="submit" value="Send Message"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-xl shadow transition-all duration-200">
        </div>
    </form>

    <!-- Placeholder (Intentional Incomplete Section) -->
    <!-- <div class="mt-8 border-t pt-4 text-center text-gray-400 italic">
        <div class="animate-pulse">
            [More message settings will be available soon...]
        </div>
    </div> -->

</div>
</body>
</html>
